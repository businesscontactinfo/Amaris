<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amaris — Contact</title>
  <meta name="description" content="Amaris — connect with us on WhatsApp, TikTok, Instagram, Facebook, phone, or website." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;          /* page background (white) */
      --card:#6b0f2b;        /* maroon buttons */
      --text:#ffffff;        /* white text inside buttons */
      --outside:#000000;     /* black text outside buttons */
      --radius:999px;
      --shadow:0 10px 30px rgba(0,0,0,.15);
      --maxw:820px;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    body{
      margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center;
      background:var(--bg); color:var(--outside); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .wrap{width:100%; max-width:var(--maxw); padding:48px 20px 60px; text-align:center}
    .logo{display:flex; align-items:center; justify-content:center; margin-bottom:18px}
    .logo img{width:180px; height:auto}
    .tagline{opacity:.9; font-size:18px; line-height:1.5; max-width:48ch; margin:0 auto 28px}
    .list{display:grid; gap:16px; margin:20px auto 36px; max-width:740px}
    .cta{
      appearance:none; border:none; outline:0; text-decoration:none; display:block; text-align:center; width:100%;
      padding:20px 24px; background:var(--card); color:var(--text); font-weight:800; font-size:20px; border-radius:var(--radius);
      box-shadow:var(--shadow); transition:transform .05s ease, filter .15s ease;
    }
    .cta:hover{transform:translateY(-2px)}
    .cta:active{transform:translateY(2px)}
    .cta small{display:block; font-weight:600; opacity:.95; font-size:14px; margin-top:4px}
    .contact-section{
      margin-top:30px; font-size:20px;
    }
    .contact-section a{
      color:var(--outside); text-decoration:none; display:block; margin:6px 0;
    }
    footer{margin-top:40px; text-align:center; opacity:.7; font-size:14px; color:var(--outside)}
    @media (max-width:480px){
      .logo img{width:150px}
      .cta{font-size:18px; padding:18px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">
      <img src="6.png" alt="Amaris logo" />
    </div>
    <p class="tagline">Connect with us on your preferred channel.</p>

    <div class="list" aria-label="Contact links">
      <a class="cta" href="https://wa.me/23274590216?text=Hi%20Amaris%2C%20I%27d%20like%20to%20make%20an%20enquiry" target="_blank" rel="noopener">Chat with Us on WhatsApp</a>
      <a class="cta" href="https://www.tiktok.com/@the.luxe.shoppe_?_t=ZM-90Qqg3MTWwK&_r=1" target="_blank" rel="noopener">Follow Us on TikTok</a>
      <a class="cta" href="https://www.instagram.com/the.luxe.shoppe_?igsh=MTM3eXZsdGJzaXJ3Zw%3D%3D&utm_source=qr" target="_blank" rel="noopener">Visit Our Instagram</a>
      <a class="cta" href="https://www.facebook.com/share/16jXBeGAGZ/?mibextid=wwXIfr" target="_blank" rel="noopener">Follow Us on Facebook</a>
      <a class="cta" href="#" target="_blank" rel="noopener">Visit Our Website</a>
    </div>

    <div class="contact-section">
      <a href="tel:+23276599261">📞 +232 76 599261</a>
    </div>

    <footer>
      © <span id="y"></span> Amaris. All rights reserved.
    </footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
