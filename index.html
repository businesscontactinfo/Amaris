<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AMARIS | Period Care Package</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top left, rgba(165, 41, 94, 0.08), transparent 35%),
    radial-gradient(circle at bottom right, rgba(133, 11, 66, 0.08), transparent 30%),
    linear-gradient(180deg, #FFF8F5 0%, #F9ECE8 50%, #F4E1DB 100%);
}

.phone-container{
    width:100%;
    max-width:430px;
}

.card{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px);
    border-radius:40px;
    padding:40px 25px;
    box-shadow:
    0 20px 50px rgba(98, 18, 53, 0.12),
    inset 0 1px 0 rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.6);
}

.logo{
    width:110px;
    display:block;
    margin:0 auto 15px;
}

.brand{
    text-align:center;
}

.brand h1{
    font-family:'Cormorant Garamond', serif;
    color:#72073D;
    font-size:58px;
    letter-spacing:4px;
    font-weight:700;
}

.subtitle{
    color:#C56A7A;
    font-size:18px;
    font-weight:600;
    margin-top:-5px;
}

.divider{
    width:70px;
    height:2px;
    background:#D7A3AD;
    margin:20px auto;
    border-radius:10px;
}

.tagline{
    text-align:center;
    color:#674A53;
    font-size:15px;
    line-height:1.9;
    margin-bottom:30px;
}

.button-group{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.link-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    background:#fff;
    padding:18px 22px;
    border-radius:28px;
    box-shadow:0 10px 30px rgba(93, 24, 48, 0.08);
    transition:0.3s ease;
    color:#54172F;
}

.link-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 35px rgba(93,24,48,0.15);
}

.left{
    display:flex;
    align-items:center;
    gap:16px;
}

.icon{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#FAEAEA;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.text{
    font-size:18px;
    font-weight:600;
}

.arrow{
    font-size:26px;
    color:#C56A7A;
}

.footer{
    margin-top:35px;
    text-align:center;
}

.footer-line{
    width:120px;
    height:1px;
    background:#DAB4BB;
    margin:0 auto 18px;
}

.promise{
    font-family:'Cormorant Garamond', serif;
    font-size:34px;
    color:#8E355A;
    font-style:italic;
}

.promise-sub{
    color:#9E7381;
    font-size:14px;
    margin-top:8px;
}

@media(max-width:480px){

.brand h1{
    font-size:48px;
}

.text{
    font-size:16px;
}

.card{
    padding:35px 20px;
}

}

</style>
</head>

<body>

<div class="phone-container">

<div class="card">

<img src="6.png" class="logo" alt="Amaris Logo">

<div class="brand">
<h1>AMARIS</h1>
<p class="subtitle">Period Care Package</p>
</div>

<div class="divider"></div>

<p class="tagline">
A promise of love, care & comfort — because every woman deserves confidence, dignity and support.
</p>

<div class="button-group">

<a href="https://wa.me/23276599261" target="_blank" class="link-btn">

<div class="left">
<div class="icon">💬</div>
<div class="text">Chat with Us on WhatsApp</div>
</div>

<div class="arrow">›</div>
</a>


<a href="https://www.tiktok.com/@amaris.co.sl?_r=1&_t=ZS-96V00G0CWSi" target="_blank" class="link-btn">

<div class="left">
<div class="icon">🎵</div>
<div class="text">Follow Us on TikTok</div>
</div>

<div class="arrow">›</div>
</a>


<a href="https://www.instagram.com/amaris.co.sl?igsh=cTd4NTlyMG50amJq" target="_blank" class="link-btn">

<div class="left">
<div class="icon">📷</div>
<div class="text">Visit Our Instagram</div>
</div>

<div class="arrow">›</div>
</a>


<a href="https://amarisapp.netlify.app/" target="_blank" class="link-btn">

<div class="left">
<div class="icon">🌐</div>
<div class="text">Visit Our Website</div>
</div>

<div class="arrow">›</div>
</a>

</div>

<div class="footer">

<div class="footer-line"></div>

<div class="promise">
A Promise of Love
</div>

<div class="promise-sub">
AMARIS © 2026
</div>

</div>

</div>

</div>

</body>
</html>
